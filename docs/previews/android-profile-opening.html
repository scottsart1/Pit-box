<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Pit Box — Email OR PIN profile preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b0f;color:#eef6fa;font-family:Segoe UI,system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%}.gate{min-height:100dvh;display:grid;place-items:center;padding:30px 24px 110px}.card{width:min(440px,100%);border:1px solid #263542;background:#121b24;border-radius:16px;padding:24px}.brand{color:#49d17d;font-size:12px;letter-spacing:.16em;font-weight:700;margin:0 0 18px}h1{font-size:28px;line-height:1.1;margin:0 0 14px}p{font-size:14px;color:#9eb2c2;line-height:1.55}.field{height:54px;border-bottom:1px solid #506572;margin:12px 0 18px;display:flex;align-items:center;color:#9eb2c2;font-size:17px}.small{font-size:12px}.action{display:block;text-align:center;background:#49d17d;color:#07100a;font-weight:700;border-radius:5px;padding:14px;margin-top:22px}.secondary{text-align:center;font-size:14px;margin:20px 0 0}.controls{position:fixed;z-index:5;bottom:18px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 12px}.controls span{font-size:11px;color:#6f8595;margin-right:8px}.controls button{border:1px solid #263542;color:#c2d2dd;background:#121b24;border-radius:30px;padding:12px 16px;cursor:pointer;min-height:44px}[hidden]{display:none!important}
.action{border:0;width:100%;font:inherit;cursor:pointer}.secondary{display:block;width:100%;background:transparent;border:0;color:#eef6fa;min-height:48px;cursor:pointer}.field{width:100%;background:transparent;border:0;border-bottom:1px solid #506572;padding:12px 0;color:#eef6fa}.driver{display:flex;align-items:center;text-align:left;gap:16px;width:100%;padding:16px;margin:12px 0;border:1px solid #263542;border-radius:10px;background:#0c141c;color:#eef6fa;cursor:pointer}.avatar{border:1px solid #344a59;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;color:#49d17d;font-weight:700}.driver small{display:block;color:#9eb2c2;margin-top:4px}.choice{display:flex;gap:8px;margin:20px 0}.choice button{flex:1;background:transparent;border:1px solid #344a59;color:#9eb2c2;border-radius:8px;min-height:46px;font:inherit;cursor:pointer}.choice button[aria-pressed=true]{border-color:#49d17d;color:#49d17d;background:#49d17d0a}.privacy{border-top:1px solid #263542;padding-top:14px;margin-top:20px}.badge{color:#49d17d;font-size:11px;letter-spacing:.08em}.callout{color:#eef6fa;border:1px solid #49d17d;border-radius:10px;padding:12px 14px;background:#070b0f}.gate{padding-bottom:100px}
</style><canvas id="intro" role="img" aria-label="Your Pit Box opening animation"></canvas><main class="gate" id="gate" hidden><div class="card" id="card"></div></main><div class="controls"><span>VISUAL PREVIEW</span><button id="replay">Replay opening</button><button id="showGate">Choose driver</button><button id="newDriver">First-time setup</button><button id="upgrade">Update with existing data</button></div>
<script>
const canvas=document.getElementById('intro'),gate=document.getElementById('gate'),ctx=canvas.getContext('2d');let started=0,frame=0;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function draw(now){const raw=Math.min(1,(now-started)/2600),p=reduced?1:(Math.cos((raw+1)*Math.PI)/2+.5),d=devicePixelRatio||1,w=innerWidth,h=innerHeight;canvas.width=w*d;canvas.height=h*d;ctx.scale(d,d);ctx.fillStyle='#070b0f';ctx.fillRect(0,0,w,h);const cx=w/2,cy=h/2,width=Math.min(w-56,360);ctx.strokeStyle='#263542';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-width/2,cy+60);ctx.lineTo(cx+width/2,cy+60);ctx.stroke();for(let i=0;i<5;i++){ctx.fillStyle=p>.82?'#49d17d':p>.12*(i+1)?'#ff6969':'#263542';ctx.beginPath();ctx.arc(cx+(i-2)*25,cy-70,5,0,Math.PI*2);ctx.fill()}ctx.textAlign='center';ctx.font=`900 ${Math.min(35,width/8.3)}px Segoe UI,system-ui,sans-serif`;ctx.fillStyle='#eff6fa';ctx.fillText('YOUR PIT BOX',cx,cy);ctx.font='500 11px Segoe UI,system-ui,sans-serif';ctx.fillStyle='#9eb2c2';ctx.fillText('YOUR RACE. YOUR ENGINEER.',cx,cy+27);ctx.fillStyle='#49d17d';ctx.fillRect(cx-width/2,cy+59,width*p,2);if(raw<1)frame=requestAnimationFrame(draw);else setTimeout(showGate,250)}
function showGate(){cancelAnimationFrame(frame);canvas.hidden=true;gate.hidden=false;picker()}function replay(){cancelAnimationFrame(frame);gate.hidden=true;canvas.hidden=false;started=performance.now();frame=requestAnimationFrame(draw)}document.getElementById('replay').onclick=replay;document.getElementById('showGate').onclick=showGate;
const card=document.getElementById('card');let method='pin';
const brand='<div class="brand">YOUR PIT BOX</div>';
const privacy='<p class="small privacy">Your email and PIN stay on this device.</p>';
function picker(){card.innerHTML=brand+'<h1>Choose your driver</h1><p>Your history. Your setup. Your engineer.</p><button class="driver" id="scott"><span class="avatar">S</span><span>Scott<small>Opens with PIN</small></span></button><button class="driver" id="maya"><span class="avatar">M</span><span>Maya<small>Opens with email</small></span></button><button class="action" id="create">+ New driver</button><p class="small">Each profile keeps its own history, settings and encrypted API keys on this device.</p>';document.getElementById('scott').onclick=()=>login('Scott','pin');document.getElementById('maya').onclick=()=>login('Maya','email');document.getElementById('create').onclick=setup}
function setup(upgrade){if(typeof upgrade!=='boolean')upgrade=window.upgradeMode===true;window.upgradeMode=upgrade;canvas.hidden=true;gate.hidden=false;cancelAnimationFrame(frame);card.innerHTML=brand+'<h1>Set up your driver profile</h1>'+(upgrade?'<p>Your Pit Box now keeps a separate profile for each driver on this device.</p><p class="callout">Everything already on this device, including your race history, settings and API keys, will be attached to this profile.</p>':'<p>Each driver gets their own history, settings and API keys on this device.</p>')+'<input class="field" aria-label="Driver name" placeholder="Driver name" maxlength="40"><p><strong style="color:#eef6fa;font-size:18px">Email OR PIN</strong><br>Choose either an email address or a 4-digit PIN to open this profile.</p><div class="choice"><button id="pinChoice" aria-pressed="'+(method==='pin')+'">4-digit PIN</button><button id="emailChoice" aria-pressed="'+(method==='email')+'">Email</button></div>'+credentialFields(true)+privacy+'<button class="action" id="openPreview">Create profile and open</button><button class="secondary" id="back">Choose another driver</button>';document.getElementById('pinChoice').onclick=()=>{method='pin';setup(window.upgradeMode)};document.getElementById('emailChoice').onclick=()=>{method='email';setup(window.upgradeMode)};wire()}
function credentialFields(create){return method==='pin'?'<input class="field" type="password" inputmode="numeric" maxlength="4" placeholder="4-digit PIN" aria-label="4-digit PIN">'+(create?'<input class="field" type="password" inputmode="numeric" maxlength="4" placeholder="Confirm PIN" aria-label="Confirm PIN">':'')+'<p class="small">Keep your PIN safe: a forgotten PIN cannot be reset.</p>':'<input class="field" type="email" placeholder="Email address" aria-label="Email address"><p class="small">No verification email is sent. Anyone who knows this address can open this profile. Choose a PIN to lock it.</p>'}
function login(driver,type){method=type;card.innerHTML=brand+'<h1>Welcome back,<br>'+driver+'</h1><p>Your API keys stay encrypted on this device.</p><p><strong style="color:#eef6fa;font-size:18px">Email OR PIN</strong></p>'+credentialFields(false)+privacy+'<button class="action" id="openPreview">Open my pit box</button><button class="secondary" id="back">Choose another driver</button>';wire()}
function wire(){document.getElementById('back').onclick=picker;document.getElementById('openPreview').onclick=()=>{card.innerHTML=brand+'<span class="badge">VISUAL PREVIEW</span><h1 style="margin-top:16px">Your pit box is ready.</h1><p>In the app, this opens the selected driver’s history, settings and keys. This preview does not save or send anything.</p><button class="action" id="back">Choose another driver</button>';document.getElementById('back').onclick=picker}}
document.getElementById('newDriver').onclick=()=>setup(false);document.getElementById('upgrade').onclick=()=>setup(true);replay();
</script></html>
