[project]
name = "pit-wall-openai"
version = "4.9.0"
description = "Multi-provider AI race engineer for live F1 26 PS5 telemetry"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=2.45,<3",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "f1-packets>=2026.1.1,<2027",
  "numpy>=2.0",
  "sounddevice>=0.5",
  "soundfile>=0.12",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]
# The marketing capture/cut tools under tools/ need these; the app does not.
video = ["pillow>=10", "imageio-ffmpeg>=0.5", "websockets>=12"]

[project.scripts]
pitwall = "pitwall.main:run"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
