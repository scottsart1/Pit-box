name = "pitwall-activation"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Draft usage endpoint: bounded native-client reports, no rate-limit identifiers
# stored in the analytics database. Keep the namespace unique to this product.
[[ratelimits]]
name = "USAGE_RATE_LIMITER"
namespace_id = "4102"
simple = { limit = 300, period = 60 }

[triggers]
crons = ["17 3 * * *"]

# D1 gives us a strongly-consistent, free-tier database. The atomic
# claim (UPDATE ... WHERE claimed=0) needs that consistency; KV would not be
# safe for single-use enforcement. Create the DB, then paste its id here:
#   wrangler d1 create pitwall-licenses
[[d1_databases]]
binding = "DB"
database_name = "pitwall-licenses"
database_id = "4360c3cd-4f56-4643-a908-85cbed0d2944"

# The installer. Deliberately a PRIVATE bucket streamed through the Worker
# rather than a public r2.dev URL, so the file cannot be fetched without a code
# that is still in the database. See handleFile in src/worker.js.
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "pitwall-downloads"

# DOWNLOAD_REPORT_TOKEN is a dedicated random read-only reporting secret.
# Set it with `wrangler secret put DOWNLOAD_REPORT_TOKEN`, never in this file.
# It grants no access to activation codes, subscriber emails or other data.
# The Worker still holds no entitlement-signing key.
