<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Activate Pit Wall on first run</title>
  <desc id="desc">Illustrated first-run Pit Wall activation window with privacy-safe placeholder activation code and a fully masked OpenAI API key.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#101720" flood-opacity="0.18"/>
    </filter>
    <style>
      .ui { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
      .ink { fill: #12171f; }
      .copy { fill: #3d4756; }
      .muted { fill: #667081; }
      .small { font-size: 18px; }
      .body { font-size: 21px; }
      .strong { font-weight: 760; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f5f7fa"/>
  <circle cx="1100" cy="615" r="160" fill="#eceff4"/>
  <path d="M0 0H1200V88H0Z" fill="#101720"/>
  <g class="ui">
    <rect x="58" y="31" width="13" height="28" rx="2" fill="#c8102e"/>
    <text x="88" y="53" fill="#ffffff" font-size="23" font-weight="820" letter-spacing="1.8">PIT WALL</text>
    <text x="1018" y="52" fill="#aab4c2" font-size="15" font-weight="700" letter-spacing="1.6">ILLUSTRATED GUIDE</text>

    <rect x="66" y="126" width="178" height="34" rx="17" fill="#f7dfe3"/>
    <text x="155" y="149" text-anchor="middle" fill="#9c0c23" font-size="15" font-weight="800" letter-spacing="1.1">STEP 4 · ACTIVATE</text>
    <text x="66" y="205" class="ink" font-size="42" font-weight="820" letter-spacing="-1.2">Activate Pit Wall</text>
    <text x="66" y="240" class="copy body">The installer starts Pit Wall and asks for both values once.</text>

    <g transform="translate(66 284)">
      <rect width="332" height="323" rx="18" fill="#ffffff" stroke="#dde2e9"/>
      <text x="24" y="43" class="ink" font-size="20" font-weight="800">Before you choose Activate</text>
      <circle cx="41" cy="89" r="16" fill="#c8102e"/>
      <text x="41" y="95" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">1</text>
      <text x="70" y="95" class="ink body strong">Paste the purchase code</text>
      <circle cx="41" cy="151" r="16" fill="#c8102e"/>
      <text x="41" y="157" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">2</text>
      <text x="70" y="157" class="ink body strong">Paste the whole API key</text>
      <circle cx="41" cy="213" r="16" fill="#c8102e"/>
      <text x="41" y="219" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">3</text>
      <text x="70" y="219" class="ink body strong">Choose Activate</text>
      <rect x="24" y="255" width="284" height="45" rx="10" fill="#e7f4ed"/>
      <path d="M43 277L48 282L57 271" fill="none" stroke="#17714b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="70" y="284" fill="#17714b" font-size="16" font-weight="740">The dashboard opens automatically.</text>
    </g>

    <g transform="translate(448 128)" filter="url(#shadow)">
      <rect width="686" height="490" rx="13" fill="#ffffff" stroke="#aeb7c3"/>
      <path d="M0 13Q0 0 13 0H673Q686 0 686 13V48H0Z" fill="#eef1f5"/>
      <rect x="16" y="15" width="9" height="19" rx="2" fill="#c8102e"/>
      <text x="35" y="31" class="ink" font-size="15" font-weight="710">Pit Wall — activation</text>
      <text x="661" y="31" text-anchor="middle" class="muted" font-size="20">×</text>

      <text x="42" y="99" class="ink" font-size="28" font-weight="800">Activate Pit Wall</text>
      <text x="42" y="134" class="copy" font-size="17">Enter the activation code from your purchase email, and an</text>
      <text x="42" y="158" class="copy" font-size="17">OpenAI API key for the race engineer.</text>
      <text x="42" y="190" class="muted" font-size="15">Your API key is stored only on this machine.</text>

      <text x="42" y="243" class="ink" font-size="17" font-weight="700">Activation code</text>
      <rect x="210" y="215" width="430" height="48" rx="5" fill="#ffffff" stroke="#8994a2" stroke-width="1.6"/>
      <text x="229" y="246" class="muted" font-size="18" font-family="ui-monospace, Consolas, monospace" letter-spacing="1">PITW-XXXXX-XXXXX-XXXXX</text>

      <text x="42" y="309" class="ink" font-size="17" font-weight="700">OpenAI API key</text>
      <rect x="210" y="281" width="430" height="48" rx="5" fill="#ffffff" stroke="#8994a2" stroke-width="1.6"/>
      <text x="229" y="313" class="ink" font-size="20" letter-spacing="4">••••••••••••••••••••</text>

      <rect x="210" y="350" width="18" height="18" rx="3" fill="#ffffff" stroke="#8994a2"/>
      <text x="239" y="365" class="ink" font-size="16">Show key</text>

      <rect x="443" y="409" width="82" height="42" rx="7" fill="#ffffff" stroke="#aeb7c3"/>
      <text x="484" y="436" text-anchor="middle" class="ink" font-size="16" font-weight="700">Quit</text>
      <rect x="538" y="409" width="102" height="42" rx="7" fill="#c8102e"/>
      <text x="589" y="436" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">Activate</text>
    </g>
  </g>
</svg>
