<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Prepare OpenAI API billing for Pit Wall</title>
  <desc id="desc">Illustrated guide showing a privacy-safe OpenAI Platform billing screen with payment method and budget setup steps.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#101720" flood-opacity="0.14"/>
    </filter>
    <style>
      .ui { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
      .ink { fill: #12171f; }
      .copy { fill: #3d4756; }
      .muted { fill: #667081; }
      .small { font-size: 18px; }
      .body { font-size: 21px; }
      .strong { font-weight: 760; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f5f7fa"/>
  <circle cx="1105" cy="615" r="160" fill="#eceff4"/>
  <path d="M0 0H1200V88H0Z" fill="#101720"/>
  <g class="ui">
    <rect x="58" y="31" width="13" height="28" rx="2" fill="#c8102e"/>
    <text x="88" y="53" fill="#ffffff" font-size="23" font-weight="820" letter-spacing="1.8">PIT WALL</text>
    <text x="1018" y="52" fill="#aab4c2" font-size="15" font-weight="700" letter-spacing="1.6">ILLUSTRATED GUIDE</text>

    <rect x="66" y="126" width="190" height="34" rx="17" fill="#f7dfe3"/>
    <text x="161" y="149" text-anchor="middle" fill="#9c0c23" font-size="15" font-weight="800" letter-spacing="1.1">STEP 2 · API BILLING</text>
    <text x="66" y="205" class="ink" font-size="42" font-weight="820" letter-spacing="-1.2">Prepare OpenAI API billing</text>
    <text x="66" y="240" class="copy body">API usage is billed separately from a ChatGPT subscription.</text>

    <g transform="translate(66 282)">
      <rect width="332" height="326" rx="18" fill="#ffffff" stroke="#dde2e9"/>
      <rect x="22" y="22" width="288" height="72" rx="12" fill="#fff7e6" stroke="#efd59b"/>
      <circle cx="50" cy="58" r="15" fill="#ffc15c"/>
      <text x="50" y="64" text-anchor="middle" fill="#5f4513" font-size="19" font-weight="850">!</text>
      <text x="76" y="49" class="ink" font-size="17" font-weight="780">ChatGPT and API billing</text>
      <text x="76" y="73" class="copy" font-size="16">are separate accounts.</text>

      <circle cx="42" cy="132" r="17" fill="#c8102e"/>
      <text x="42" y="138" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">1</text>
      <text x="72" y="138" class="ink body strong">Open Billing</text>
      <path d="M42 153V177" stroke="#dde2e9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="42" cy="195" r="17" fill="#c8102e"/>
      <text x="42" y="201" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">2</text>
      <text x="72" y="201" class="ink body strong">Add a payment method</text>
      <path d="M42 212V236" stroke="#dde2e9" stroke-width="3" stroke-linecap="round"/>
      <circle cx="42" cy="254" r="17" fill="#c8102e"/>
      <text x="42" y="260" text-anchor="middle" fill="#fff" font-size="17" font-weight="800">3</text>
      <text x="72" y="251" class="ink body strong">Review auto-recharge</text>
      <text x="72" y="277" class="muted" font-size="16">Turn it off or cap recharges.</text>
    </g>

    <g transform="translate(438 127)" filter="url(#shadow)">
      <rect width="696" height="493" rx="20" fill="#ffffff" stroke="#dde2e9"/>
      <path d="M0 20Q0 0 20 0H676Q696 0 696 20V66H0Z" fill="#101720"/>
      <circle cx="28" cy="33" r="7" fill="#c8102e"/>
      <circle cx="52" cy="33" r="7" fill="#667081"/>
      <circle cx="76" cy="33" r="7" fill="#667081"/>
      <rect x="108" y="18" width="547" height="30" rx="8" fill="#27313d"/>
      <text x="128" y="39" fill="#d8dee9" font-size="15">OpenAI Platform · Billing</text>

      <rect x="0" y="66" width="164" height="427" fill="#f5f7fa"/>
      <text x="26" y="108" class="ink" font-size="18" font-weight="800">OpenAI Platform</text>
      <text x="26" y="153" class="muted" font-size="16">Overview</text>
      <rect x="14" y="170" width="136" height="40" rx="8" fill="#f7dfe3"/>
      <rect x="24" y="181" width="4" height="18" rx="2" fill="#c8102e"/>
      <text x="40" y="196" fill="#9c0c23" font-size="16" font-weight="780">Billing</text>
      <text x="26" y="244" class="muted" font-size="16">Usage</text>
      <text x="26" y="280" class="muted" font-size="16">API keys</text>

      <text x="196" y="114" class="ink" font-size="29" font-weight="820">Billing</text>
      <text x="196" y="145" class="muted" font-size="17">Manage API payment and spending controls.</text>

      <rect x="196" y="174" width="458" height="111" rx="14" fill="#ffffff" stroke="#dde2e9"/>
      <text x="220" y="209" class="ink" font-size="19" font-weight="790">Payment methods</text>
      <text x="220" y="239" class="muted" font-size="16">No account details are shown in this guide.</text>
      <rect x="473" y="216" width="155" height="43" rx="9" fill="#c8102e"/>
      <text x="550.5" y="243" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">Add payment method</text>

      <rect x="196" y="304" width="458" height="118" rx="14" fill="#ffffff" stroke="#dde2e9"/>
      <text x="220" y="339" class="ink" font-size="19" font-weight="790">Auto-recharge</text>
      <text x="220" y="369" class="muted" font-size="16">Turn it off or set a recharge limit.</text>
      <rect x="494" y="334" width="134" height="48" rx="9" fill="#f5f7fa" stroke="#aeb7c3"/>
      <text x="561" y="364" text-anchor="middle" class="ink" font-size="15" font-weight="760">Recharge limit</text>
      <rect x="220" y="393" width="408" height="7" rx="3.5" fill="#eceff4"/>
      <rect x="220" y="393" width="102" height="7" rx="3.5" fill="#17714b"/>

      <circle cx="209" cy="460" r="12" fill="#17714b"/>
      <path d="M203 460L208 465L216 455" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="230" y="466" fill="#17714b" font-size="17" font-weight="740">Billing ready · continue to API keys</text>
    </g>
  </g>
</svg>
