<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Connect F1 25: 2026 Season Pack on PS5 to Pit Wall with UDP telemetry</title>
  <desc id="desc">Illustrated guide pairing Pit Wall Connection Center settings with privacy-safe F1 25: 2026 Season Pack PS5 UDP telemetry settings: recommended local IPv4 address, port 20777, and format 2026.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#101720" flood-opacity="0.14"/>
    </filter>
    <style>
      .ui { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
      .ink { fill: #12171f; }
      .copy { fill: #3d4756; }
      .muted { fill: #667081; }
      .small { font-size: 18px; }
      .body { font-size: 21px; }
      .strong { font-weight: 760; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f5f7fa"/>
  <circle cx="1095" cy="610" r="164" fill="#eceff4"/>
  <path d="M0 0H1200V88H0Z" fill="#101720"/>
  <g class="ui">
    <rect x="58" y="31" width="13" height="28" rx="2" fill="#c8102e"/>
    <text x="88" y="53" fill="#ffffff" font-size="23" font-weight="820" letter-spacing="1.8">PIT WALL</text>
    <text x="1018" y="52" fill="#aab4c2" font-size="15" font-weight="700" letter-spacing="1.6">ILLUSTRATED GUIDE</text>

    <rect x="66" y="126" width="180" height="34" rx="17" fill="#f7dfe3"/>
    <text x="156" y="149" text-anchor="middle" fill="#9c0c23" font-size="15" font-weight="800" letter-spacing="1.1">STEP 5 · CONNECT</text>
    <text x="66" y="205" class="ink" font-size="42" font-weight="820" letter-spacing="-1.2">Connect F1 25: 2026 Season Pack</text>
    <text x="66" y="240" class="copy body">Copy the PC address from Connection, then match the UDP settings in game.</text>

    <g transform="translate(66 282)" filter="url(#shadow)">
      <rect width="478" height="328" rx="18" fill="#ffffff" stroke="#dde2e9"/>
      <rect width="478" height="59" rx="18" fill="#101720"/>
      <path d="M0 42H478V59H0Z" fill="#101720"/>
      <rect x="22" y="18" width="9" height="22" rx="2" fill="#c8102e"/>
      <text x="45" y="37" fill="#ffffff" font-size="19" font-weight="800">Pit Wall · CONNECTION</text>
      <circle cx="417" cy="29.5" r="8" fill="#ffc15c"/>
      <text x="433" y="36" fill="#d8dee9" font-size="15" font-weight="700">Listening</text>

      <text x="27" y="100" class="ink" font-size="25" font-weight="820">Connection Center</text>
      <text x="27" y="126" class="muted" font-size="15">Use this PC’s recommended local address.</text>

      <rect x="27" y="150" width="424" height="76" rx="12" fill="#f5f7fa" stroke="#dde2e9"/>
      <text x="47" y="177" class="muted" font-size="14" font-weight="750" letter-spacing=".7">ENTER THIS UDP IP ON PS5</text>
      <text x="47" y="210" class="ink" font-size="25" font-family="ui-monospace, Consolas, monospace" font-weight="800">192.168.x.x</text>
      <rect x="341" y="168" width="88" height="40" rx="8" fill="#ffffff" stroke="#aeb7c3"/>
      <text x="385" y="194" text-anchor="middle" class="ink" font-size="15" font-weight="750">Copy IP</text>

      <rect x="27" y="242" width="202" height="56" rx="11" fill="#f5f7fa" stroke="#dde2e9"/>
      <text x="45" y="264" class="muted" font-size="13" font-weight="750">UDP PORT</text>
      <text x="45" y="288" class="ink" font-size="22" font-weight="820">20777</text>
      <rect x="247" y="242" width="204" height="56" rx="11" fill="#fff7e6" stroke="#efd59b"/>
      <text x="265" y="264" fill="#73591d" font-size="13" font-weight="750">PACKET FORMAT</text>
      <text x="265" y="288" class="ink" font-size="22" font-weight="820">2026</text>
    </g>

    <path d="M561 437H635" stroke="#c8102e" stroke-width="5" stroke-linecap="round"/>
    <path d="M621 423L636 437L621 451" fill="none" stroke="#c8102e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="598" y="473" text-anchor="middle" fill="#9c0c23" font-size="14" font-weight="800" letter-spacing=".7">COPY ACROSS</text>

    <g transform="translate(652 282)" filter="url(#shadow)">
      <rect width="482" height="328" rx="18" fill="#101720"/>
      <text x="29" y="30" fill="#ffffff" font-size="17" font-weight="800">F1 25 · 2026 SEASON PACK</text>
      <text x="29" y="50" fill="#91a6b8" font-size="12" font-weight="750" letter-spacing="1">TELEMETRY SETTINGS</text>
      <path d="M29 57H453" stroke="#2f3a46"/>

      <text x="30" y="97" fill="#d8dee9" font-size="17">UDP Telemetry</text>
      <rect x="367" y="72" width="85" height="34" rx="17" fill="#17714b"/>
      <circle cx="435" cy="89" r="13" fill="#ffffff"/>
      <text x="405" y="95" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">On</text>

      <rect x="22" y="118" width="438" height="52" rx="9" fill="#202a35"/>
      <text x="40" y="150" fill="#d8dee9" font-size="17">UDP IP Address</text>
      <text x="437" y="150" text-anchor="end" fill="#ffffff" font-size="19" font-family="ui-monospace, Consolas, monospace" font-weight="780">192.168.x.x</text>

      <rect x="22" y="180" width="438" height="52" rx="9" fill="#202a35"/>
      <text x="40" y="212" fill="#d8dee9" font-size="17">UDP Port</text>
      <text x="437" y="212" text-anchor="end" fill="#ffffff" font-size="19" font-weight="780">20777</text>

      <rect x="22" y="242" width="438" height="52" rx="9" fill="#2a2023" stroke="#c8102e"/>
      <text x="40" y="274" fill="#ffffff" font-size="17">UDP Format</text>
      <text x="437" y="274" text-anchor="end" fill="#ffffff" font-size="19" font-weight="820">2026</text>
    </g>

    <rect x="66" y="632" width="1068" height="44" rx="12" fill="#e7f4ed" stroke="#bcdcca"/>
    <circle cx="91" cy="654" r="11" fill="#17714b"/>
    <path d="M85 654L90 659L98 649" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="661" fill="#17714b" font-size="18" font-weight="790">Start an on-track session and wait for “Receiving telemetry.” Listening alone is not proof.</text>
  </g>
</svg>
