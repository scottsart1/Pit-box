<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Connect F1 25: 2026 Season Pack on PC to Pit Wall with UDP telemetry</title>
  <desc id="desc">Illustrated guide showing F1 25: 2026 Season Pack PC UDP telemetry settings for two setups: the loopback address when Pit Wall and the game run on the same computer, and Pit Wall's recommended local IPv4 address when the game runs on a second PC. Port 20777, format 2026.</desc>
  <defs>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#101720" flood-opacity="0.14"/>
    </filter>
    <style>
      .ui2 { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
      .ink2 { fill: #12171f; }
      .copy2 { fill: #3d4756; }
      .muted2 { fill: #667081; }
      .body2 { font-size: 21px; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#f5f7fa"/>
  <circle cx="1095" cy="610" r="164" fill="#eceff4"/>
  <path d="M0 0H1200V88H0Z" fill="#101720"/>
  <g class="ui2">
    <rect x="58" y="31" width="13" height="28" rx="2" fill="#c8102e"/>
    <text x="88" y="53" fill="#ffffff" font-size="23" font-weight="820" letter-spacing="1.8">PIT WALL</text>
    <text x="1018" y="52" fill="#aab4c2" font-size="15" font-weight="700" letter-spacing="1.6">ILLUSTRATED GUIDE</text>

    <rect x="66" y="126" width="220" height="34" rx="17" fill="#f7dfe3"/>
    <text x="176" y="149" text-anchor="middle" fill="#9c0c23" font-size="15" font-weight="800" letter-spacing="1.1">STEP 6 · PC ALTERNATIVE</text>
    <text x="66" y="205" class="ink2" font-size="42" font-weight="820" letter-spacing="-1.2">Playing on PC instead?</text>
    <text x="66" y="240" class="copy2 body2">Same telemetry settings menu. Pick the address for your setup.</text>

    <g transform="translate(66 282)" filter="url(#shadow2)">
      <rect width="478" height="328" rx="18" fill="#ffffff" stroke="#dde2e9"/>
      <rect width="478" height="59" rx="18" fill="#101720"/>
      <path d="M0 42H478V59H0Z" fill="#101720"/>
      <rect x="22" y="18" width="9" height="22" rx="2" fill="#c8102e"/>
      <text x="45" y="37" fill="#ffffff" font-size="19" font-weight="800">Which PC setup?</text>

      <rect x="27" y="82" width="424" height="98" rx="12" fill="#f5f7fa" stroke="#dde2e9"/>
      <text x="47" y="110" class="ink2" font-size="17" font-weight="800">Game on this same PC</text>
      <text x="47" y="133" class="muted2" font-size="14">Pit Wall and F1 25 share one computer.</text>
      <rect x="47" y="145" width="180" height="26" rx="6" fill="#eef6f0" stroke="#bcdcca"/>
      <text x="57" y="163" class="ink2" font-size="15" font-family="ui-monospace, Consolas, monospace" font-weight="800">127.0.0.1</text>

      <rect x="27" y="192" width="424" height="98" rx="12" fill="#f5f7fa" stroke="#dde2e9"/>
      <text x="47" y="220" class="ink2" font-size="17" font-weight="800">Game on a second PC</text>
      <text x="47" y="243" class="muted2" font-size="14">Same network, separate computer running the game.</text>
      <rect x="47" y="255" width="240" height="26" rx="6" fill="#f5f7fa" stroke="#dde2e9"/>
      <text x="57" y="273" class="ink2" font-size="14" font-family="ui-monospace, Consolas, monospace" font-weight="700">Use the address from Step 5</text>
    </g>

    <path d="M561 437H635" stroke="#c8102e" stroke-width="5" stroke-linecap="round"/>
    <path d="M621 423L636 437L621 451" fill="none" stroke="#c8102e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="598" y="473" text-anchor="middle" fill="#9c0c23" font-size="14" font-weight="800" letter-spacing=".7">TYPE INTO GAME</text>

    <g transform="translate(652 282)" filter="url(#shadow2)">
      <rect width="482" height="328" rx="18" fill="#101720"/>
      <rect width="482" height="34" rx="18" fill="#1b2531"/>
      <path d="M0 20H482V34H0Z" fill="#1b2531"/>
      <circle cx="24" cy="17" r="6" fill="#e0645c"/>
      <circle cx="44" cy="17" r="6" fill="#e3b552"/>
      <circle cx="64" cy="17" r="6" fill="#5cb87d"/>
      <text x="241" y="22" text-anchor="middle" fill="#c3cbd6" font-size="13" font-weight="700">F1 25: 2026 Season Pack — Settings</text>

      <text x="29" y="66" fill="#ffffff" font-size="17" font-weight="800">F1 25 · 2026 SEASON PACK</text>
      <text x="29" y="86" fill="#91a6b8" font-size="12" font-weight="750" letter-spacing="1">TELEMETRY SETTINGS (PC)</text>
      <path d="M29 93H453" stroke="#2f3a46"/>

      <text x="30" y="133" fill="#d8dee9" font-size="17">UDP Telemetry</text>
      <rect x="367" y="108" width="85" height="34" rx="17" fill="#17714b"/>
      <circle cx="435" cy="125" r="13" fill="#ffffff"/>
      <text x="405" y="131" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="800">On</text>

      <rect x="22" y="154" width="438" height="52" rx="9" fill="#202a35"/>
      <text x="40" y="186" fill="#d8dee9" font-size="17">UDP IP Address</text>
      <text x="437" y="186" text-anchor="end" fill="#ffffff" font-size="19" font-family="ui-monospace, Consolas, monospace" font-weight="780">127.0.0.1</text>
      <path d="M400 197 L416 197 L416 205 L424 191 L416 177 L416 185 L400 185 Z" fill="#ffffff" opacity="0"/>

      <rect x="22" y="216" width="438" height="52" rx="9" fill="#202a35"/>
      <text x="40" y="248" fill="#d8dee9" font-size="17">UDP Port</text>
      <text x="437" y="248" text-anchor="end" fill="#ffffff" font-size="19" font-weight="780">20777</text>

      <rect x="22" y="278" width="438" height="52" rx="9" fill="#2a2023" stroke="#c8102e"/>
      <text x="40" y="310" fill="#ffffff" font-size="17">UDP Format</text>
      <text x="437" y="310" text-anchor="end" fill="#ffffff" font-size="19" font-weight="820">2026</text>

      <circle cx="410" cy="180" r="9" fill="#ffffff" opacity=".92"/>
      <path d="M406 176L416 184M416 176L406 184" stroke="#101720" stroke-width="0" opacity="0"/>
      <path d="M405.5 179.5L414.5 174.5L410.8 183.2L409.2 179.8Z" fill="#101720"/>
    </g>

    <rect x="66" y="632" width="1068" height="44" rx="12" fill="#e7f4ed" stroke="#bcdcca"/>
    <circle cx="91" cy="654" r="11" fill="#17714b"/>
    <path d="M85 654L90 659L98 649" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="661" fill="#17714b" font-size="18" font-weight="790">Pit Wall listens the same way regardless of platform — start a session and wait for “Receiving telemetry.”</text>
  </g>
</svg>
