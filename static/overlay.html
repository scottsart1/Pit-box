<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Pit Box Overlay</title>
<style>
/* Transparent by default for OBS browser sources. Append ?bg=1 for an opaque
   panel when using this as a phone/tablet second screen. */
:root{font-family:Segoe UI,system-ui,sans-serif;color:#eef4f8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent}
body.solid{background:#070b0f}
.wrap{position:fixed;left:12px;top:12px;display:flex;flex-direction:column;gap:8px;
  width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto}
.card{background:rgba(9,14,20,.82);border:1px solid #26414f;border-radius:10px;
  padding:10px 12px;backdrop-filter:blur(2px)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.row[hidden]{display:none}
.pos{font-size:34px;font-weight:900;line-height:1}
.label{font-size:10px;letter-spacing:.14em;color:#8fa4b7;text-transform:uppercase}
.big{font-size:20px;font-weight:800}
.delta.pos-good{color:#49d17d}
.delta.pos-bad{color:#ff6969}
.tyre{font-size:13px}
.wear{color:#ffc15c}
.instr{font-size:13px;color:#cfe0ee;line-height:1.35}
.radio{font-size:13px;color:#9fd0ff;line-height:1.35;font-style:italic}
.muted{color:#8fa4b7}
.hidden{display:none}
.status,.notice{font-size:11px;line-height:1.4;color:#8fa4b7}
.status{margin-bottom:6px}.notice:not(:empty){margin-top:6px}
.instr,.radio,.notice{overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div id="status" class="status" role="status">Telemetry unavailable</div>
    <div class="row">
      <div><div class="label">Pos</div><div class="pos" id="pos">—</div></div>
      <div style="text-align:right">
        <div class="label">Delta to PB</div>
        <div class="big delta" id="delta">—</div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="row"><span class="label">Tyres</span><span class="tyre" id="tyre">—</span></div>
    <div class="row"><span class="label">Wear FL/FR/RL/RR</span><span class="tyre wear" id="wear">—</span></div>
    <div class="row"><span class="label">Fuel Δ</span><span class="tyre" id="fuel">—</span></div>
  </div>
  <div class="card" id="stratCard">
    <div class="label">Strategy</div>
    <div class="instr" id="strat">Building…</div>
    <div class="instr notice" id="alternative"></div>
    <div class="notice" id="strategyNotice"></div>
    <div class="row" id="strategyProjection"><span class="label">Finish / wear / deg</span><span class="tyre" id="stratMeta">—</span></div>
  </div>
  <div class="card" id="radioCard">
    <div class="label">Last radio</div>
    <div class="radio" id="radio">—</div>
  </div>
</div>
<script type="module">
import { normalizeState, finite, positive } from '/static/driver-dashboard/model.mjs';
if (new URLSearchParams(location.search).get("bg") === "1") document.body.classList.add("solid");

function fmtDelta(v){
  if (finite(v) === null) return "—";
  const s = (v >= 0 ? "+" : "") + Number(v).toFixed(2);
  return s;
}

function render(state, {ageMs = 0, now = Date.now(), transportLost = false} = {}){
  const group = id => {
    const time = finite(state.packet_group_freshness?.[id]);
    return time !== null && now / 1000 - time >= -5 && now / 1000 - time < 5;
  };
  const suspension = !!(state.red_flag_active || state.race_control_phase === 'red_flag' || state.fia_flag === 'red');
  // Shared normalization handles expired flag families even when unrelated
  // packets keep the socket active. A lost transport expires all readings.
  const snapshot = transportLost ? {...state, connected: false} : state;
  const data = normalizeState(snapshot, {ageMs, now});
  const finished = positive(state.final_classification?.position);
  const live = data.fresh && finished === null;
  const lap = live && group('2'), status = live && group('7'), damage = live && group('10');
  const pos = finished ?? (lap ? data.position : null);
  document.getElementById("pos").textContent = pos ? "P" + pos : "—";
  document.getElementById('status').textContent = finished !== null ? `Session complete · P${finished}`
    : data.provisionalRestart ? 'Last confirmed · provisional'
    : !data.fresh ? 'Telemetry unavailable'
    : suspension ? 'Red flag · session suspended'
    : lap && status && damage ? 'Live telemetry' : 'Some current readings unavailable';

  const delta = lap ? data.delta : null;
  const el = document.getElementById("delta");
  el.textContent = fmtDelta(delta);
  el.classList.toggle("pos-good", typeof delta === "number" && delta < 0);
  el.classList.toggle("pos-bad", typeof delta === "number" && delta > 0);

  document.getElementById("tyre").textContent =
    status ? data.compound + (data.tyreAge !== null ? " · " + data.tyreAge + " laps" : "") : '—';
  document.getElementById("wear").textContent =
    damage ? data.wear.map(w => w === null ? '—' : Math.round(w) + "%").join(" ") : "—";

  const fuel = status ? data.fuelMargin : null;
  document.getElementById("fuel").textContent =
    typeof fuel === "number" ? (fuel >= 0 ? "+" : "") + fuel.toFixed(1) + " laps" : "—";

  const usablePlan = live && group('1') && group('2') && status && state.strategy?.available;
  document.getElementById("strat").textContent = finished !== null ? 'Session complete. Review recorded laps in Analysis.'
    : data.suspended ? data.plan : usablePlan ? data.plan : 'Current strategy unavailable';
  document.getElementById('alternative').textContent = data.suspended && data.restartAlternative
    ? 'Alternative: ' + data.restartAlternative : '';
  document.getElementById('strategyNotice').textContent = data.provisionalRestart
    ? 'Live telemetry unavailable. Confirm the suspension, tyre sets and track conditions in game before using this plan.'
    : data.suspended ? 'Follow the game’s suspension instructions. Select restart tyres while stopped.' : '';
  const showProjection = !!usablePlan && !data.suspended;
  document.getElementById('strategyProjection').hidden = !showProjection;
  const rec = showProjection ? state.strategy.recommended || {} : {};
  const slope = state.analysis && state.analysis.deg_model && state.analysis.deg_model.current_slope_s_per_lap;
  const hold = state.strategy_hold && state.strategy_hold.active;
  document.getElementById("stratMeta").textContent = !showProjection ? '—' : hold
    ? "DRIVER HOLD"
    : "P" + (rec.projected_finish_position || "—") + " / " +
      (finite(rec.projected_finish_wear_pct) === null ? "—" : Math.round(rec.projected_finish_wear_pct) + "%") + " / " +
      (finite(slope) === null ? "—" : fmtDelta(slope) + "s/L");
  // Historical BOX calls must not look actionable during suspension/finish.
  document.getElementById("radio").textContent = live && !suspension ? data.radio || '—' : '—';
}

let snapshot = {}, receivedAt = 0, messageVersion = 0, transportLost = true;
function paint(){render(snapshot, {ageMs: receivedAt ? Date.now() - receivedAt : Infinity, transportLost});}
function accept(state){snapshot = state && typeof state === 'object' ? state : {}; receivedAt = Date.now(); transportLost = false; paint();}
function disconnect(){messageVersion++; transportLost = true; paint();}
function connect(){
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onmessage = (ev) => { try { const state = JSON.parse(ev.data); messageVersion++; accept(state); } catch (e) {} };
  ws.onerror = disconnect;
  ws.onclose = () => {disconnect(); setTimeout(connect, 1000);};
}
// Paint once from the REST snapshot before the first socket frame arrives.
// The overlay is a second-screen/OBS surface: waiting for a push meant it sat
// blank on load, and stayed blank indefinitely if the socket was blocked.
const initialVersion = messageVersion;
fetch("/api/state").then(r => {if (!r.ok) throw new Error('State unavailable'); return r.json();})
  .then(state => {if (messageVersion === initialVersion) accept(state);}).catch(() => {});
connect();
// A silently stalled socket must expire too; REST is only the initial paint.
setInterval(paint, 500);
</script>
</body>
</html>
