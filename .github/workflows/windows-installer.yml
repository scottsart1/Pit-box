# Build the Windows installer on a GitHub-hosted Windows runner.
#
# release_windows.ps1 is the full release and runs on the owner's PC. This
# workflow covers the one step of it that needs Windows, the PyInstaller and
# Inno Setup build, so a fixed installer can be produced without that PC.
# The installer is uploaded as a workflow artifact and attached to a GitHub
# Release tagged with the app version, from where the R2 upload and the site
# deploy can be run from anywhere with wrangler and a Cloudflare token.
#
# Only the app suite and the two offline launcher test files run here: the
# rest of distribution/tests needs the signing key, which is never in CI.
name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      attach_release:
        description: Attach the installer to a GitHub Release tagged v<version>
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build outside the checkout, as build.py expects
        shell: pwsh
        run: '"PITWALL_BUILD_DIR=$env:RUNNER_TEMP\PitWallBuild" >> $env:GITHUB_ENV'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app and the packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller cryptography

      - name: Run the tests that need no signing key
        run: python -m pytest tests distribution/tests/test_free_edition.py distribution/tests/test_packaged_entry.py -q

      - name: Make sure Inno Setup is present
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0,'src'); import pitwall; print(pitwall.__version__)"
          if ($LASTEXITCODE -ne 0 -or -not $v) { throw "could not read the version" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        run: python -m distribution.packaging.build --installer

      - name: Check the installer and record its digest
        id: installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:PITWALL_BUILD_DIR "artifacts\PitWall-Setup.exe"
          if (-not (Test-Path $installer)) { throw "build reported success but $installer does not exist" }
          $bytes = (Get-Item $installer).Length
          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($bytes -lt 1MB) { throw "$installer is only $bytes bytes" }
          "path=$installer" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "## PitWall-Setup.exe ${{ steps.version.outputs.version }}`n`n- $bytes bytes`n- SHA-256 ``$sha``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: PitWall-Setup-${{ steps.version.outputs.version }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: Attach the installer to a GitHub Release
        if: ${{ inputs.attach_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $file = "${{ steps.installer.outputs.path }}"
          $notes = "PitWall-Setup.exe built from ${{ github.sha }}.`n`nSHA-256: ${{ steps.installer.outputs.sha256 }}"
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $file --repo ${{ github.repository }} --target ${{ github.sha }} --title "Your Pit Box $tag" --notes $notes
          } else {
            gh release upload $tag $file --repo ${{ github.repository }} --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
