# Build the Windows installer on a GitHub-hosted Windows runner.
#
# release_windows.ps1 is the full release and runs on the owner's PC. This
# workflow builds with PyInstaller/Inno Setup and smoke-tests the installed
# artifact on a disposable Windows runner before anything can be published.
# Candidate PR installers are workflow artifacts only. A manual run can also
# attach its installer to a GitHub Release tagged with the app version.
#
# Licensing tests generate temporary keys, so the full suite can run in CI
# without accessing the production signing key.
name: Build Windows installer

on:
  pull_request:
    paths:
      - src/**
      - static/**
      - pyproject.toml
      - distribution/packaging/**
      - distribution/tests/test_installer*.py
      - .github/workflows/windows-installer.yml
  workflow_dispatch:
    inputs:
      attach_release:
        description: Attach the installer to a GitHub Release tagged v<version>
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Keep candidate builds scoped to the requested implementation branch.
    # No fork receives a write-capable candidate build or release attachment.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.head_ref == 'codex/android-wifi-history' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build outside the checkout, as build.py expects
        shell: pwsh
        run: '"PITWALL_BUILD_DIR=$env:RUNNER_TEMP\PitWallBuild" >> $env:GITHUB_ENV'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app and the packaging tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller cryptography

      - name: Run the full test suite
        run: python -m pytest -q

      - name: Make sure Inno Setup is present
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0,'src'); import pitwall; print(pitwall.__version__)"
          if ($LASTEXITCODE -ne 0 -or -not $v) { throw "could not read the version" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the installer
        run: python -m distribution.packaging.build --installer

      - name: Check the installer and record its digest
        id: installer
        shell: pwsh
        run: |
          $installer = Join-Path $env:PITWALL_BUILD_DIR "artifacts\PitWall-Setup.exe"
          if (-not (Test-Path $installer)) { throw "build reported success but $installer does not exist" }
          $bytes = (Get-Item $installer).Length
          $sha = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($bytes -lt 1MB) { throw "$installer is only $bytes bytes" }
          "path=$installer" >> $env:GITHUB_OUTPUT
          "sha256=$sha" >> $env:GITHUB_OUTPUT
          "## PitWall-Setup.exe ${{ steps.version.outputs.version }}`n`n- $bytes bytes`n- SHA-256 ``$sha``" >> $env:GITHUB_STEP_SUMMARY

      - name: Smoke-test the installed Windows artifact
        id: smoke
        timeout-minutes: 15
        shell: pwsh
        run: |
          python -m distribution.packaging.smoke_installer --installer "${{ steps.installer.outputs.path }}" --version "${{ steps.version.outputs.version }}" --stress-telemetry
          if ($LASTEXITCODE -ne 0) { throw "Installed Windows artifact smoke test failed" }
          "`n- Installed artifact smoke: install, frozen startup, 25-lap UDP stress, full SQLite integrity, persistence/restart, shutdown, uninstall/data retention passed." >> $env:GITHUB_STEP_SUMMARY
          "- Transfer management is exercised through the installed EXE; diagnostics state whether the runner had a usable private LAN for TLS/QR checks." >> $env:GITHUB_STEP_SUMMARY

      - name: Counted full-field UDP reception and responsiveness
        id: counted
        timeout-minutes: 8
        shell: pwsh
        run: |
          python tools/counted-telemetry-smoke.py --executable "$env:PITWALL_BUILD_DIR/dist/Your Pit Box/Your Pit Box.exe" --version "${{ steps.version.outputs.version }}" --output-parent "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { throw "Counted UDP reception/responsiveness failed" }

      - name: Preserve counted telemetry evidence
        if: ${{ always() && steps.counted.outputs.diagnostics != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PitWall-counted-telemetry-${{ steps.version.outputs.version }}
          path: ${{ steps.counted.outputs.diagnostics }}
          if-no-files-found: error
          retention-days: 7

      - name: Preserve installer-smoke diagnostics
        if: ${{ always() && steps.smoke.outputs.diagnostics != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PitWall-installer-smoke-${{ steps.version.outputs.version }}
          path: ${{ steps.smoke.outputs.diagnostics }}
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: PitWall-Setup-${{ steps.version.outputs.version }}
          # Retain the exact frozen runtime too: the owner can test it with
          # isolated data without replacing an existing Inno installation.
          path: |
            ${{ steps.installer.outputs.path }}
            ${{ env.PITWALL_BUILD_DIR }}/artifacts/YourPitBox-windows.zip
          if-no-files-found: error

      - name: Require a trusted publisher signature before public attachment
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.attach_release }}
        shell: pwsh
        env:
          PITBOX_WINDOWS_CERT_SHA1: ${{ vars.PITBOX_WINDOWS_CERT_SHA1 }}
        run: |
          . ./distribution/packaging/verify-production-signature.ps1
          Assert-ProductionSignature -Path "${{ steps.installer.outputs.path }}" -ExpectedThumbprint $env:PITBOX_WINDOWS_CERT_SHA1
          Assert-ProductionSignature -Path (Join-Path $env:PITWALL_BUILD_DIR 'dist/Your Pit Box/Your Pit Box.exe') -ExpectedThumbprint $env:PITBOX_WINDOWS_CERT_SHA1

      - name: Attach the installer to a GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.attach_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          $file = "${{ steps.installer.outputs.path }}"
          $notes = "PitWall-Setup.exe built from ${{ github.sha }}.`n`nSHA-256: ${{ steps.installer.outputs.sha256 }}"
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $file --repo ${{ github.repository }} --target ${{ github.sha }} --title "Your Pit Box $tag" --notes $notes
          } else {
            gh release upload $tag $file --repo ${{ github.repository }} --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
