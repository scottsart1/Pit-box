name: Deploy notes vault

# Deploys the notes vault Worker (yourpitbox.com/notes) from the public
# scottsart1/inkwell repository, using this repository's Cloudflare key. The
# Worker's code, tests and deploy script live in inkwell/web/notes-vault; this
# workflow only checks them out and runs them. NOTES_LINK_ID is never set here:
# the Worker's existing link is kept.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: inkwell branch, tag or commit to deploy
        default: main
  push:
    branches: [claude/deploy-notes-vault]
    paths: [.github/workflows/deploy-notes-vault.yml]

permissions:
  contents: read

concurrency:
  group: notes-vault-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: inkwell/web/notes-vault
    steps:
      - uses: actions/checkout@v4
        with:
          repository: scottsart1/inkwell
          ref: ${{ inputs.ref || 'main' }}
          path: inkwell
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npx vitest run
      # This repository's key can upload Workers but not edit their routes. The
      # routes (yourpitbox.com/notes*) were set up once and stay as they are, so
      # that one refusal is accepted; any other failure fails the job.
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          bash scripts/deploy.sh 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -q "Uploaded notes-vault" "$RUNNER_TEMP/deploy.log" \
              && grep -q "notes-vault/routes) failed" "$RUNNER_TEMP/deploy.log" \
              || exit "$status"
            echo "::warning::The Worker code deployed; this key cannot edit routes, so the existing routes were kept."
            # deploy.sh stopped before its clean-up: remove the old password secrets.
            for old in NOTES_PASSWORD SESSION_SECRET; do
              printf 'y\n' | npx --no-install wrangler secret delete "$old" --name notes-vault \
                || echo "::warning::$old was not removed (it may already be gone)."
            done
          fi
      - name: Check the vault answers
        run: |
          for _ in 1 2 3 4 5 6; do
            curl -sS --fail https://yourpitbox.com/notes/api/ping | grep -q '"ok":true' && exit 0
            sleep 10
          done
          echo "::error::https://yourpitbox.com/notes/api/ping does not answer."
          exit 1
