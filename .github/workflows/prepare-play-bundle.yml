name: Prepare Play Android bundle

# Build only from reviewed main. This job uses the existing release environment
# key but does not publish an APK or submit anything to Google Play.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-play-bundle
  cancel-in-progress: false

jobs:
  bundle:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 60
    env:
      RELEASE_CERT_SHA256: 20c2751e5c0ede43a2442331336b990433e53d9e512f3f1bca3e8d5bee4c6983
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install the Android build platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: actions/setup-python@v5
        id: py312
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v5
        id: py313
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install wheel tools
        run: |
          "${{ steps.py312.outputs.python-path }}" -m pip install --quiet cibuildwheel uv
          "${{ steps.py313.outputs.python-path }}" -m pip install --quiet 'f1-packets>=2026.1.1,<2027'
      - name: Restore cross-compiled wheels
        uses: actions/cache@v4
        with:
          path: android/wheels
          key: android-wheels-${{ hashFiles('android/build-wheels.sh', 'android/check-wheels.py', 'android/native-requirements.txt') }}-${{ runner.os }}
      - name: Cross-compile and verify native dependencies
        env:
          PITBOX_HOST_PYTHON: ${{ steps.py312.outputs.python-path }}
        run: bash ./android/build-wheels.sh
      - name: Check release signing prerequisites
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::The release environment is missing Android signing credentials."
            exit 1
          fi
      - name: Build the signed Play bundle
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PITBOX_KEYSTORE_PATH: ${{ runner.temp }}/pitbox-play.keystore
          PITBOX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PITBOX_KEY_ALIAS: pitbox-release
          PITBOX_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          trap 'rm -f "$PITBOX_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$PITBOX_KEYSTORE_PATH"
          chmod 600 "$PITBOX_KEYSTORE_PATH"
          ./gradlew --no-daemon bundleRelease -Ppitbox.buildPython=${{ steps.py313.outputs.python-path }}
      - name: Verify bundle signature and native alignment
        id: verify
        run: |
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          jarsigner -verify "$bundle" | grep -q 'jar verified.'
          cert=$(keytool -printcert -jarfile "$bundle" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test "$cert" = "$RELEASE_CERT_SHA256" || {
            echo "::error::Bundle certificate does not match existing Android installations."
            exit 1
          }
          python tools/check_android_native_alignment.py "$bundle"
          sha256=$(sha256sum "$bundle" | cut -d' ' -f1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "### Signed Play bundle" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Certificate SHA-256: $cert" >> "$GITHUB_STEP_SUMMARY"
          echo "Bundle SHA-256: $sha256" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the signed bundle for Play internal testing
        uses: actions/upload-artifact@v4
        with:
          name: YourPitBox-Play-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
